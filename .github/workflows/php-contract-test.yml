# PHP の SDK 契約テスト。
#
#   (A) 候補SDKがビルドできる
#   (B) そのリクエストが最新specのモックに受理され、レスポンスがデシリアライズできる
#   (C) 直近リリースが最新specに対してなお往復できる
#
# 言語非依存の処理は saasus-platform/github-actions のコンポジットアクション。
# PHP 固有のビルド/テスト手順だけがここにある。
#
# pull_request のみ（pull_request_target は使わない）: fork PR に secrets は渡らない。
#
# --- 本番SDKリポジトリとの差分（サンドボックス固有） ---
#
# 1. php/ 配下で動く。本番 saasus-sdk-php ではSDKがリポジトリ直下にあるため、
#    移植時は working-directory と paths を落とし、(C) の
#    latest-release/php を latest-release に戻す。
# 2. ジョブ名が contract-test ではなく php-contract-test。1リポジトリに
#    複数言語のワークフローが同居するため、必須チェック名を言語ごとに
#    一意にする必要がある。
#
# C# 版にある「モックの security 要件を剥がす」ステップは PHP には無い。
# PHP の契約テストは生成クライアントを直接叩き、合成 Bearer を付与する
# プラグインを使う。spec は bearer スキームを宣言しモックはその値を
# 検証しないため、剥がす必要がない（Go と同じ理屈）。

name: PHP SDK Contract Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    # 他言語のツリーだけを触るPRでPHPのジョブを動かさない。
    paths:
      - "php/**"
      - ".github/workflows/php-contract-test.yml"

concurrency:
  group: sdk-contract-php-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 必須ステータスチェック名。リネームしないこと。
  contract-test:
    name: php-contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR (candidate SDK)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.1"
          tools: composer
          coverage: none

      - name: Set up Node (for Prism)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # 短命トークン。private な api リポジトリに contents:read のみ。
      - name: Mint api read token
        id: api-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SPEC_READER_APP_ID }}
          private-key: ${{ secrets.SPEC_READER_PRIVATE_KEY }}
          owner: Anti-Pattern-Inc
          repositories: saasus-api

      - name: Fetch OpenAPI spec
        id: spec
        uses: saasus-platform/github-actions/.github/actions/fetch-openapi-spec@main
        with:
          token: ${{ steps.api-token.outputs.token }}

      # 再生成はしない: マージされる成果物は commit 済みのコードである。
      # PHP には compile 工程がないため「ビルド/型チェック」は
      # composer validate ＋ composer install（autoloader 構築）＋
      # generated/・src/・test/ 全 PHP ファイルの php -l 構文チェック、とする。
      - name: (A) Build candidate SDK
        working-directory: php
        run: |
          set -euo pipefail
          composer validate --no-check-publish --no-check-all
          composer install --no-interaction --no-progress --prefer-dist
          status=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "Syntax error in ${file}"
              php -l "$file" || true
              status=1
            fi
          done < <(find generated src test -name '*.php' -print0)
          exit $status

      # static モード。レスポンスが spec の example から返るため oneOf が
      # 解決可能になる。dynamic モードは example を無視する。
      - name: Start Prism mocks
        uses: saasus-platform/github-actions/.github/actions/setup-prism@main
        with:
          spec-dir: ${{ steps.spec.outputs.spec-dir }}
          modules: ${{ steps.spec.outputs.modules }}

      # (B) 最新SDKの仕様準拠: リクエストが受理され、レスポンスが
      # デシリアライズできる。スイートは CONTRACT_SPEC_DIR の spec から
      # operation を自動列挙し、モックのURLは setup が export した
      # PRISM_URL_<MODULE> で渡る。
      - name: (B) Candidate SDK contract
        working-directory: php
        env:
          CONTRACT_SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
          # 候補SDKは spec の全 operation を網羅していなければならない。
          CONTRACT_REQUIRE_COMPLETE: "true"
        run: vendor/bin/phpunit -c test/phpunit.contract.xml --log-junit "$PWD/contract-junit-latest.xml"

      # モノレポなのでタグは言語横断の単一系列。タグのツリーには全言語が
      # 入っているため、言語ごとのスイートはその中の自分のサブディレクトリに
      # ある。
      - name: Resolve latest release tag
        id: release-tag
        uses: saasus-platform/github-actions/.github/actions/resolve-latest-stable-tag@main

      - name: Checkout latest release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release-tag.outputs.tag }}
          path: latest-release

      # 現行ハーネスのコピーではなくリリースタグ自身のスイートを走らせる。
      # 各リリースはそれが同梱していたテストで検証される。Prism と
      # CONTRACT_SPEC_DIR はどちらも最新spec を指したまま。
      #
      # スイートが存在する前に打たれたタグは当該ディレクトリを持たず、ここで
      # 設計通り失敗する。スキップ機構は設けない。
      - name: (C) Latest release forward-compat (bundled suite)
        working-directory: latest-release/php
        env:
          CONTRACT_SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
        run: |
          set -euo pipefail
          composer install --no-interaction --no-progress --prefer-dist
          vendor/bin/phpunit -c test/phpunit.contract.xml --log-junit "$PWD/contract-junit-old.xml"

      # 最新SDK (B) と旧SDK (C) の JUnit レポートを証跡として保持する。
      # 失敗メッセージは operation id と HTTP ステータスのみで、本文は出さない。
      - name: Upload JUnit contract reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: php-contract-test-reports
          path: |
            php/contract-junit-latest.xml
            latest-release/php/contract-junit-old.xml
          if-no-files-found: ignore
