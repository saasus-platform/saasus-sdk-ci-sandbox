# SDK contract test (A)(B)(C) calling workflow.
#
# This thin file lives in the SDK repository. The language-agnostic steps
# (fetch spec, start Prism, resolve the previous release tag) come from the
# central reusable repo saasus-platform/github-actions. The C#-specific
# build/test steps stay here.
#
# What it checks:
#   (A) the latest SDK builds
#   (B) the latest SDK's requests are accepted by the mock and responses deserialize
#   (C) the previously released SDK still round-trips against the latest spec
#
# Security:
#   - pull_request only (never pull_request_target); fork PRs do not receive secrets.
#   - the api read token is masked; no response body, spec body or PII is printed.

name: SDK Contract Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: sdk-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job name "contract-test" is the required status check name. Do not rename.
  contract-test:
    name: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR (latest SDK)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Node (for Prism via npx)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Short-lived installation token (contents:read on the private api repo only).
      - name: Mint api read token
        id: api-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SPEC_READER_APP_ID }}
          private-key: ${{ secrets.SPEC_READER_PRIVATE_KEY }}
          owner: Anti-Pattern-Inc
          repositories: saasus-api

      # The api repository is resolved inside the action; the ref is pinned
      # below.
      #
      # TEMPORARY: ref is api main, not the latest stable tag.
      #
      # The spec fixes this suite depends on are merged to api main but are not
      # in any tag yet: the latest stable tag v1.13.14 (2026-10-09) predates
      # them, and cutting a new api tag is not cheap. Against v1.13.14 the mock
      # answers 500 to 13 operations because it cannot produce the response the
      # spec declares — PricingUnit's oneOf members are not mutually exclusive
      # ("must match exactly one schema in oneOf") and several string-typed
      # fields carry unquoted numeric examples ("must be string"). Those are
      # spec defects, already fixed on main.
      #
      # Revert to the default (omit ref) as soon as an api tag contains them.
      # Until then CI depends on a moving ref: an unrelated api merge can turn
      # a green PR red, and a re-run of the same SDK commit is not reproducible.
      - name: Fetch OpenAPI spec
        id: spec
        uses: saasus-platform/github-actions/.github/actions/fetch-openapi-spec@d932828fd89316e931ea89f50695b4f83c2a3bd5 # github-actions main
        with:
          token: ${{ steps.api-token.outputs.token }}
          dest: openapi-spec
          ref: main

      # The committed generated code is the artifact that gets merged, so it is
      # what is built here; the api repo's "Update SDK" workflow runs
      # generate.sh when it opens the PR but never compiles the result, so this
      # is where that happens.
      - name: (A) Build latest SDK
        run: dotnet build saasus-sdk-csharp.csproj --configuration Release

      # The C# client cannot satisfy the bearer scheme the specs declare: its
      # generated ApiClient overwrites the Authorization header with a SaaSus
      # SigV1 signature (generated/<module>api/Expansion/ExpansionApiClient.cs),
      # so the mock answers 401 to every operation. The real API accepts that
      # signature, so the mismatch is in the spec's declared security scheme,
      # not in the SDK; until the spec describes it, the mock's security
      # requirement is dropped here. Request validation against the schema and
      # the declared responses — all this suite checks — stay enforced, and the
      # authentication layer is out of scope anyway (see the design issue).
      - name: Drop the mock's security requirement (C#-specific)
        env:
          SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
        run: |
          set -euo pipefail
          for spec in "${SPEC_DIR}"/*.yml; do
            awk '
              /^security:/ { skip = 1; next }
              skip && /^[[:space:]]/ { next }
              { skip = 0; print }
            ' "${spec}" > "${spec}.stripped"
            mv "${spec}.stripped" "${spec}"
          done

      # Static mode: responses come from the spec's examples, which is how the
      # spec makes oneOf responses resolvable. Dynamic mode would ignore them.
      - name: Start Prism mocks
        uses: saasus-platform/github-actions/.github/actions/setup-prism@d932828fd89316e931ea89f50695b4f83c2a3bd5 # github-actions main
        with:
          spec-dir: ${{ steps.spec.outputs.spec-dir }}
          modules: ${{ steps.spec.outputs.modules }}
          base-port: "4010"

      # The suite enumerates every spec operation of the modules named in
      # CONTRACT_MODULES and reads the per-module mock URLs from the
      # PRISM_URL_<MODULE> variables exported above. The module list is
      # declared once, by the fetch-openapi-spec action, and is passed from
      # there to the Prism setup and to the suite, so no copy of it exists
      # here. The trx report is kept as evidence (uploaded below): every case
      # that ran and its result is in the test display names.
      - name: (B) Latest SDK contract
        env:
          CONTRACT_SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
          CONTRACT_MODULES: ${{ steps.spec.outputs.modules }}
          # The latest SDK must cover every spec operation.
          CONTRACT_REQUIRE_COMPLETE: "true"
        run: >
          dotnet test tests/Contract/SaaSusSdk.Contract.Tests.csproj --configuration Release
          --results-directory contract-reports
          --logger "trx;LogFileName=contract-latest.trx"

      - name: Resolve previous SDK stable tag
        id: old-tag
        uses: saasus-platform/github-actions/.github/actions/resolve-latest-stable-tag@d932828fd89316e931ea89f50695b4f83c2a3bd5 # github-actions main

      - name: Checkout old SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.old-tag.outputs.tag }}
          path: old-sdk

      # (C) Forward compatibility: the previously released SDK must still
      # round-trip against the LATEST spec. The old tag's OWN bundled suite is
      # run (the current one is not copied in), so each release is checked with
      # the test it shipped with; Prism and CONTRACT_SPEC_DIR both point at the
      # latest spec.
      #
      # A tag published before the suite existed has no
      # tests/Contract/SaaSusSdk.Contract.Tests.csproj and fails here by
      # design: there is no skip mechanism.
      - name: (C) Old SDK forward-compat (bundled suite)
        env:
          CONTRACT_SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
          CONTRACT_MODULES: ${{ steps.spec.outputs.modules }}
        working-directory: old-sdk
        run: >
          dotnet test tests/Contract/SaaSusSdk.Contract.Tests.csproj --configuration Release
          --results-directory contract-reports
          --logger "trx;LogFileName=contract-old.trx"

      # Both trx reports — the latest SDK (B) and the old SDK (C) — are kept as
      # evidence: each case (operation + body variant + call form + result) is
      # in the display names. Uploaded even on failure, where the old SDK report
      # can be absent because (B) failed first, hence if-no-files-found: ignore.
      - name: Upload contract test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-test-reports
          path: |
            contract-reports/**
            old-sdk/contract-reports/**
          if-no-files-found: ignore
