# C# SDK の公開API互換チェック（サンドボックス）。
#
# 契約テストが見られない「公開C# APIの破壊的変更」を検出する。契約テストは
# リクエスト本文を JSON のキー名でモデルへ流し込むため、利用側コードが位置で
# 束縛する公開コンストラクタ/シグネチャを一度も通らない。モデルにプロパティが
# 挿入されると生成コンストラクタの引数がずれ、その破壊が契約テストでは緑のまま
# すり抜ける（例: CreateTenantUserParam への新フィールド追加）。
#
# PR の公開APIを直近リリースタグと比較する。NuGet 公開は不要で、ベースラインは
# 前タグをソースからビルドする。
#
# --- 本番SDKリポジトリとの差分（サンドボックス固有） ---
#
# 1. csharp/ 配下で動く。本番 saasus-sdk-csharp ではSDKがリポジトリ直下に
#    あるため、移植時は working-directory と paths を落とし、baseline のビルドを
#    latest-release/csharp から latest-release に戻す。
# 2. ジョブ名が api-compat ではなく csharp-api-compat。1リポジトリに複数言語が
#    同居するため、必須チェック名を言語ごとに一意にする必要がある。

name: C# SDK API Compatibility

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "csharp/**"
      - ".github/workflows/csharp-api-compat.yml"

concurrency:
  group: api-compat-csharp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 必須ステータスチェック名。リネームしないこと。
  api-compat:
    name: csharp-api-compat
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR (candidate SDK)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      # このリポジトリのタグを git ls-remote で読む。リポジトリは public。
      - name: Resolve latest release tag
        id: release-tag
        uses: saasus-platform/github-actions/.github/actions/resolve-latest-stable-tag@main

      - name: Checkout latest release (baseline SDK)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release-tag.outputs.tag }}
          path: latest-release

      # 固定: クリーン/破壊の判定に使う出力文字列はツールのバージョン内でのみ
      # 安定する。8.0.x のツールは net6 ターゲットなので、net8 ランナー上では
      # roll-forward で動かす（compare ステップ参照）。
      - name: Install ApiCompat tool
        run: dotnet tool install --global Microsoft.DotNet.ApiCompat.Tool --version 8.0.400

      # CopyLocalLockFileAssemblies でパッケージ依存を成果物の隣に出し、
      # ApiCompat が参照として解決できるようにする。
      - name: Build baseline
        run: dotnet build latest-release/csharp/saasus-sdk-csharp.csproj -c Release -p:CopyLocalLockFileAssemblies=true -o baseline-out

      - name: Build candidate
        run: dotnet build csharp/saasus-sdk-csharp.csproj -c Release -p:CopyLocalLockFileAssemblies=true -o candidate-out

      # 非 strict: ベースラインの公開APIが候補に維持されているか（利用側が
      # 壊れる削除・変更）を見る。optional メンバ追加などの互換変更は許容。
      # netstandard ファサードは成果物ではなく共有フレームワークにあるため
      # そこから解決する。ツールは破壊検出時も exit 0 を返すので、判定は出力で
      # 行い、クリーン時の定型文が出なければ（破壊・参照解決失敗・ツール異常の
      # いずれでも）job を fail させる。
      - name: Compare public API against latest release
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          export DOTNET_ROLL_FORWARD=LatestMajor
          nsref="$(dirname "$(find "$(dirname "$(readlink -f "$(command -v dotnet)")")/shared" -name netstandard.dll | sort | tail -1)")"
          apicompat \
            --left  baseline-out/saasus-sdk-csharp.dll \
            --right candidate-out/saasus-sdk-csharp.dll \
            --lref  "baseline-out,${nsref}" \
            --rref  "candidate-out,${nsref}" | tee apicompat.txt
          if ! grep -q "ran successfully without finding any breaking changes" apicompat.txt; then
            echo "::error::Public API breaking changes detected against ${{ steps.release-tag.outputs.tag }}. If intentional, bump the SDK major version."
            exit 1
          fi
