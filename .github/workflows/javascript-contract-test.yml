# JavaScript の SDK 契約テスト。
#
#   (A) 候補SDKがビルドできる
#   (B) そのリクエストが最新specのモックに受理され、レスポンスがデシリアライズできる
#   (C) 直近リリースが最新specに対してなお往復できる
#
# 言語非依存の処理は saasus-platform/github-actions のコンポジットアクション。
# JavaScript 固有のビルド/テスト手順だけがここにある。
#
# pull_request のみ（pull_request_target は使わない）: fork PR に secrets は渡らない。
#
# --- 本番SDKリポジトリとの差分（サンドボックス固有） ---
#
# 1. javascript/ 配下で動く。本番 saasus-sdk-javascript ではSDKがリポジトリ
#    直下にあるため、移植時は working-directory と paths を落とし、(C) の
#    latest-release/javascript を latest-release に戻す。
# 2. ジョブ名が contract-test ではなく javascript-contract-test。1リポジトリに
#    複数言語のワークフローが同居するため、必須チェック名を言語ごとに
#    一意にする必要がある。
#
# C# 版にある「モックの security 要件を剥がす」ステップは JavaScript には無い。
# 契約テストは素の生成クライアントを直接叩き、合成 Bearer を accessToken に
# 設定する。spec は bearer スキームを宣言しモックはその値を検証しないため、
# 剥がす必要がない（Go/PHP/Python と同じ理屈）。

name: JavaScript SDK Contract Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    # 他言語のツリーだけを触るPRでJavaScriptのジョブを動かさない。
    paths:
      - "javascript/**"
      - ".github/workflows/javascript-contract-test.yml"

concurrency:
  group: sdk-contract-javascript-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 必須ステータスチェック名。リネームしないこと。
  contract-test:
    name: javascript-contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR (candidate SDK)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Prism の実行基盤も兼ねる。
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # 短命トークン。private な api リポジトリに contents:read のみ。
      - name: Mint api read token
        id: api-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SPEC_READER_APP_ID }}
          private-key: ${{ secrets.SPEC_READER_PRIVATE_KEY }}
          owner: Anti-Pattern-Inc
          repositories: saasus-api

      - name: Fetch OpenAPI spec
        id: spec
        uses: saasus-platform/github-actions/.github/actions/fetch-openapi-spec@main
        with:
          token: ${{ steps.api-token.outputs.token }}

      # 再生成はしない: マージされる成果物は commit 済みのコードである。
      - name: Install dependencies
        working-directory: javascript
        run: npm install

      # typescript-axios の生成コードは src/** に入り、rollup は import 経由で
      # しか到達しないため tsc で src 全体を型検査する。
      - name: (A) Build and type-check candidate SDK
        working-directory: javascript
        run: |
          set -euo pipefail
          npm run build
          npx tsc --noEmit -p tsconfig.json

      # static モード。レスポンスが spec の example から返るため oneOf が
      # 解決可能になる。dynamic モードは example を無視する。
      - name: Start Prism mocks
        uses: saasus-platform/github-actions/.github/actions/setup-prism@main
        with:
          spec-dir: ${{ steps.spec.outputs.spec-dir }}
          modules: ${{ steps.spec.outputs.modules }}

      # CONTRACT_MODULES は Prism 起動と同じ出力から来るので、モジュール一覧の
      # コピーはここに存在しない。モックのURLは setup が export した
      # PRISM_URL_<MODULE> で渡る。
      - name: (B) Candidate SDK contract
        working-directory: javascript
        env:
          CONTRACT_SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
          CONTRACT_MODULES: ${{ steps.spec.outputs.modules }}
          # 候補SDKは spec の全 operation を網羅していなければならない。
          CONTRACT_REQUIRE_COMPLETE: "true"
        run: npx jest --config jest.contract.config.js --verbose

      # モノレポなのでタグは言語横断の単一系列。タグのツリーには全言語が
      # 入っているため、言語ごとのスイートはその中の自分のサブディレクトリに
      # ある。
      - name: Resolve latest release tag
        id: release-tag
        uses: saasus-platform/github-actions/.github/actions/resolve-latest-stable-tag@main

      - name: Checkout latest release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release-tag.outputs.tag }}
          path: latest-release

      - name: Install latest release dependencies
        working-directory: latest-release/javascript
        run: npm install

      # 現行ハーネスのコピーではなくリリースタグ自身のスイートを走らせる。
      # 各リリースはそれが同梱していたテストで検証される。Prism と
      # CONTRACT_SPEC_DIR はどちらも最新spec を指したまま。
      #
      # スイートが存在する前に打たれたタグは当該ディレクトリを持たず、ここで
      # 設計通り失敗する。スキップ機構は設けない。
      - name: (C) Latest release forward-compat (bundled suite)
        working-directory: latest-release/javascript
        env:
          CONTRACT_SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
          CONTRACT_MODULES: ${{ steps.spec.outputs.modules }}
        run: npx jest --config jest.contract.config.js --verbose
