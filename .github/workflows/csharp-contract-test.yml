# C# の SDK 契約テスト。
#
#   (A) 候補SDKがビルドできる
#   (B) そのリクエストが最新specのモックに受理され、レスポンスがデシリアライズできる
#   (C) 直近リリースが最新specに対してなお往復できる
#
# 言語非依存の処理は saasus-platform/github-actions のコンポジットアクション。
# C# 固有のビルド/テスト手順だけがここにある。
#
# pull_request のみ（pull_request_target は使わない）: fork PR に secrets は渡らない。
#
# --- 本番SDKリポジトリとの差分（サンドボックス固有） ---
#
# 1. csharp/ 配下で動く。本番 saasus-sdk-csharp ではSDKがリポジトリ直下にあるため、
#    移植時は working-directory と paths を落とし、(C) の
#    latest-release/csharp を latest-release に戻す。
# 2. ジョブ名が contract-test ではなく csharp-contract-test。1リポジトリに
#    複数言語のワークフローが同居するため、必須チェック名を言語ごとに
#    一意にする必要がある。

# 検証用トリガー: タグ v3.0.0（6言語のスイート同梱）発行後の定常状態で
# (A)(B)(C) 全緑を実測するための no-op 変更。verify/3336-abc 専用でマージしない。

name: C# SDK Contract Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    # 他言語のツリーだけを触るPRでC#のジョブを動かさない。
    paths:
      - "csharp/**"
      - ".github/workflows/csharp-contract-test.yml"

concurrency:
  group: sdk-contract-csharp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 必須ステータスチェック名。リネームしないこと。
  contract-test:
    name: csharp-contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR (candidate SDK)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Node (for Prism)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # 短命トークン。private な api リポジトリに contents:read のみ。
      - name: Mint api read token
        id: api-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SPEC_READER_APP_ID }}
          private-key: ${{ secrets.SPEC_READER_PRIVATE_KEY }}
          owner: Anti-Pattern-Inc
          repositories: saasus-api

      - name: Fetch OpenAPI spec
        id: spec
        uses: saasus-platform/github-actions/.github/actions/fetch-openapi-spec@main
        with:
          token: ${{ steps.api-token.outputs.token }}

      # 再生成はしない: マージされる成果物は commit 済みのコードである。
      # api リポジトリの "Update SDK" ワークフローはPRを開くときに
      # generate.sh を走らせるが結果をコンパイルしないため、ここが生成コードを
      # CI でコンパイルする最初の場所になる。
      - name: (A) Build candidate SDK
        working-directory: csharp
        run: dotnet build saasus-sdk-csharp.csproj --configuration Release

      # 生成された ApiClient は Authorization ヘッダを SaaSus SigV1 署名で
      # 上書きする。どの spec もそのスキームを宣言していないため、モックは
      # 全 operation に 401 を返す。実APIはこの署名を受理するので、ずれている
      # のは spec 側で SDK ではない。本スイートが検証するリクエスト検証と
      # レスポンス検証はそのまま強制され、認証層はスコープ外。
      - name: Drop the mock's security requirement (C#-specific)
        env:
          SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
        run: |
          set -euo pipefail
          for spec in "${SPEC_DIR}"/*.yml; do
            awk '
              /^security:/ { skip = 1; next }
              skip && /^[[:space:]]/ { next }
              { skip = 0; print }
            ' "${spec}" > "${spec}.stripped"
            mv "${spec}.stripped" "${spec}"
          done

      # static モード。レスポンスが spec の example から返るため oneOf が
      # 解決可能になる。dynamic モードは example を無視する。
      - name: Start Prism mocks
        uses: saasus-platform/github-actions/.github/actions/setup-prism@main
        with:
          spec-dir: ${{ steps.spec.outputs.spec-dir }}
          modules: ${{ steps.spec.outputs.modules }}

      # CONTRACT_MODULES は Prism 起動と同じ出力から来るので、モジュール一覧の
      # コピーはここに存在しない。モックのURLは setup が export した
      # PRISM_URL_<MODULE> で渡る。
      - name: (B) Candidate SDK contract
        working-directory: csharp
        env:
          CONTRACT_SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
          CONTRACT_MODULES: ${{ steps.spec.outputs.modules }}
          # 候補SDKは spec の全 operation を網羅していなければならない。
          CONTRACT_REQUIRE_COMPLETE: "true"
        run: >
          dotnet test tests/Contract/SaaSusSdk.Contract.Tests.csproj --configuration Release
          --results-directory contract-reports
          --logger "trx;LogFileName=contract-candidate.trx"

      # モノレポなのでタグは言語横断の単一系列。タグのツリーには全言語が
      # 入っているため、言語ごとのスイートはその中の自分のサブディレクトリに
      # ある。
      - name: Resolve latest release tag
        id: release-tag
        uses: saasus-platform/github-actions/.github/actions/resolve-latest-stable-tag@main

      - name: Checkout latest release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release-tag.outputs.tag }}
          path: latest-release

      # 現行ハーネスのコピーではなくリリースタグ自身のスイートを走らせる。
      # 各リリースはそれが同梱していたテストで検証される。Prism と
      # CONTRACT_SPEC_DIR はどちらも最新spec を指したまま。
      #
      # スイートが存在する前に打たれたタグは当該プロジェクトを持たず、ここで
      # 設計通り失敗する。スキップ機構は設けない。
      - name: (C) Latest release forward-compat (bundled suite)
        working-directory: latest-release/csharp
        env:
          CONTRACT_SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
          CONTRACT_MODULES: ${{ steps.spec.outputs.modules }}
        run: >
          dotnet test tests/Contract/SaaSusSdk.Contract.Tests.csproj --configuration Release
          --results-directory contract-reports
          --logger "trx;LogFileName=contract-release.trx"

      # 何が走ったかの証跡: 各ケースは trx の表示名になっている。(B) が先に
      # 落ちてリリース側のレポートが無いこともあるため失敗時もアップロードし、
      # if-no-files-found: ignore にしている。
      - name: Upload contract test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csharp-contract-test-reports
          path: |
            csharp/contract-reports/**
            latest-release/csharp/contract-reports/**
          if-no-files-found: ignore
